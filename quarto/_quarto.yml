format:
  live-html:
    include-in-header:
      text: |
        <meta name="robots" content="noindex, nofollow">
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    code-fold: false
    code-tools: true
    code-copy: true
    highlight-style: github
    number-sections: False
    link-external-newwindow: true
    grid:
      sidebar-width: 350px
execute:
  freeze: auto
  cache: true
  error: true


pyodide:
  packages:
    - matplotlib
    - numpy
    - seaborn
    - nbformat
    - plotly